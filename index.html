          showToast("success", "Course added");
        } else {
          const i = courses.findIndex((c) => c.id === oldId);
          if (i >= 0) courses[i] = obj;
          showToast("success", "Course updated");
        }
        closeModal();
        renderPage("courses");
      }
      function deleteCourse(id) {
        if (!confirm("Delete course?")) return;
        courses = courses.filter((c) => c.id !== id);
        renderPage("courses");
        showToast("warn", "Course deleted");
      }

      // ─── SESSIONS ────────────────────────────────────────────────────────────────
      let sessionFilter = "All";
      function renderSessions() {
        const filtered = sessions.filter(
          (s) => sessionFilter === "All" || s.courseId === sessionFilter,
        );
        const rows =
          filtered.length === 0
            ? `<tr><td colspan="7">${emptyState("📅", "No sessions found")}</td></tr>`
            : filtered
                .map((s) => {
                  const c = courses.find((x) => x.id === s.courseId);
                  const recs = records.filter((r) => r.sessionId === s.id);
                  const sp = recs.filter((r) => r.status === "present").length;
                  const sl = recs.filter((r) => r.status === "late").length;
                  const sa = recs.filter((r) => r.status === "absent").length;
                  return `<tr>
        <td><div style="font-size:13px;font-weight:600;">${esc(c?.code || "")}</div><div style="font-size:10px;color:var(--muted);">${esc(c?.name || "")}</div></td>
        <td style="font-size:12px;font-family:var(--mono);">${s.date}</td>
        <td style="font-size:12px;color:var(--muted2);font-family:var(--mono);">${s.startTime}–${s.endTime}</td>
        <td style="font-size:12px;color:var(--muted2);">${esc(s.room)}</td>
        <td><span style="font-size:11px;font-weight:600;color:var(--yellow);background:rgba(245,200,66,0.1);padding:2px 8px;border-radius:6px;">${s.lateAfter}m</span></td>
        <td><div class="flex gap-10" style="font-size:11px;font-weight:600;">
          <span style="color:#3ecf8e;">✓ ${sp}</span>
          <span style="color:#f5c842;">⏰ ${sl}</span>
          <span style="color:#f06a6a;">✗ ${sa}</span>
        </div></td>
        <td><div class="flex gap-6" style="gap:6px;">
          ${actionBtn("Edit", "#3ecf8e", `editSession('${s.id}')`)}
          ${actionBtn("Del", "#f06a6a", `deleteSession('${s.id}')`)}
        </div></td>
      </tr>`;
                })
                .join("");
        return `
    <div class="page-header mb-24">
      <div><h1>Sessions</h1><p class="subtitle">${sessions.length} class sessions</p></div>
      <button class="btn btn-green" onclick="addSession()">+ Add Session</button>
    </div>
    <div class="flex gap-10 mb-16">
      <select onchange="sessionFilter=this.value;renderPage('sessions')" style="width:260px;">
        <option value="All">All Courses</option>
        ${courses.map((c) => `<option value="${c.id}" ${c.id === sessionFilter ? "selected" : ""}>${esc(c.code)} – ${esc(c.name)}</option>`).join("")}
      </select>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead><tr>${["Course", "Date", "Time", "Room", "Late After", "Records", "Actions"].map((h) => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
      }
      function sessionForm(s, mode) {
        return `
    <div class="grid-2">
      <div class="span-2"><div class="field-label">Course <span class="req">*</span></div>
        <select id="ssf-courseId">${courses.map((c) => `<option value="${c.id}" ${c.id === s.courseId ? "selected" : ""}>${esc(c.code)} – ${esc(c.name)}</option>`).join("")}</select>
      </div>
      <div><div class="field-label">Date</div><input type="date" id="ssf-date" value="${s.date}" /></div>
      <div><div class="field-label">Room</div><input type="text" id="ssf-room" value="${esc(s.room)}" /></div>
      <div><div class="field-label">Start Time</div><input type="time" id="ssf-startTime" value="${s.startTime}" /></div>
      <div><div class="field-label">End Time</div><input type="time" id="ssf-endTime" value="${s.endTime}" /></div>
      <div class="span-2"><div class="field-label">Late After (minutes)</div><input type="number" id="ssf-lateAfter" value="${s.lateAfter}" min="0" /></div>
    </div>
    <div class="flex gap-10" style="justify-content:flex-end;margin-top:22px;">
      <button onclick="closeModal()" class="btn btn-ghost">Cancel</button>
      <button class="btn btn-green" onclick="saveSession('${esc(s.id)}','${mode}')">Save</button>
    </div>
  `;
      }
      function addSession() {
        openModal(
          "Add Session",
          sessionForm(
            {
              id: "SS" + uid().slice(0, 4),
              courseId: courses[0]?.id || "",
              date: todayDate(),
              startTime: "08:00",
              endTime: "10:00",
              room: "Room 101",
              lateAfter: 15,
            },
            "add",
          ),
        );
      }
      function editSession(id) {
        const s = sessions.find((x) => x.id === id);
        if (s) openModal("Edit Session", sessionForm(s, "edit"));
      }
      function saveSession(oldId, mode) {
        const courseId = document.getElementById("ssf-courseId").value;
        const date = document.getElementById("ssf-date").value;
        if (!courseId || !date) return;
        const obj = {
          id: oldId,
          courseId,
          date,
          room: document.getElementById("ssf-room").value.trim(),
          startTime: document.getElementById("ssf-startTime").value,
          endTime: document.getElementById("ssf-endTime").value,
          lateAfter:
            parseInt(document.getElementById("ssf-lateAfter").value) || 15,
        };
        if (mode === "add") {
          obj.id = "SS" + uid().slice(0, 4);
          sessions.push(obj);
          showToast("success", "Session added");
        } else {
          const i = sessions.findIndex((s) => s.id === oldId);
          if (i >= 0) sessions[i] = obj;
          showToast("success", "Session updated");
        }
        closeModal();
        renderPage("sessions");
      }
      function deleteSession(id) {
        if (!confirm("Delete session?")) return;
        sessions = sessions.filter((s) => s.id !== id);
        renderPage("sessions");
        showToast("warn", "Session deleted");
      }

      // ─── RECORDS ─────────────────────────────────────────────────────────────────
      let recSearch = "",
        recSessionFilter = "All",
        recStatusFilter = "All";
      function renderRecords() {
        const filtered = records.filter((r) => {
          const s = students.find((x) => x.id === r.studentId);
          const matchSearch =
            !recSearch ||
            (s &&
              (s.name.includes(recSearch) ||
                s.nameEn.toLowerCase().includes(recSearch.toLowerCase()) ||
                s.id.includes(recSearch)));
          return (
            matchSearch &&
            (recSessionFilter === "All" || r.sessionId === recSessionFilter) &&
            (recStatusFilter === "All" || r.status === recStatusFilter)
          );
        });
        const rows =
          filtered.length === 0
            ? `<tr><td colspan="7">${emptyState("📋", "No records found")}</td></tr>`
            : filtered
                .map((r) => {
                  const s = students.find((x) => x.id === r.studentId);
                  const sess = sessions.find((x) => x.id === r.sessionId);
                  const c = courses.find((x) => x.id === sess?.courseId);
                  return `<tr>
        <td><div class="flex gap-8" style="align-items:center;">${avatar(s?.photo || "??", undefined, 30)}
          <div><div style="font-size:12px;font-weight:600;">${esc(s?.name || "Unknown")}</div>
          <div style="font-size:10px;color:var(--muted);font-family:var(--mono);">${s?.id || ""}</div></div></div></td>
        <td><div style="font-size:12px;font-weight:600;">${esc(c?.code || "")}</div>
          <div style="font-size:10px;color:var(--muted);font-family:var(--mono);">${sess?.date || ""} · ${esc(sess?.room || "")}</div></td>
        <td style="font-size:12px;font-family:var(--mono);">${r.time}</td>
        <td>${pill(r.method, "#5b8dee")}</td>
        <td>${badge(r.status)}</td>
        <td style="font-size:10px;color:var(--muted);max-width:120px;">${esc(r.note) || "—"}</td>
        <td><div class="flex gap-6" style="gap:6px;">
          ${actionBtn("Edit", "#f5c842", `editRecord('${r.id}')`)}
          ${actionBtn("Del", "#f06a6a", `deleteRecord('${r.id}')`)}
        </div></td>
      </tr>`;
                })
                .join("");
        return `
    <div class="page-header mb-24">
      <div><h1>Records</h1><p class="subtitle">${records.length} total · ${filtered.length} shown</p></div>
    </div>
    <div class="flex gap-10 mb-16" style="flex-wrap:wrap;">
      <div class="search-wrap" style="flex:1;min-width:180px;">
        <input type="text" value="${esc(recSearch)}" placeholder="Search student…" oninput="recSearch=this.value;renderPage('records')" />
      </div>
      <select onchange="recSessionFilter=this.value;renderPage('records')" style="min-width:200px;">
        <option value="All">All Sessions</option>
        ${sessions
          .map((s) => {
            const c = courses.find((x) => x.id === s.courseId);
            return `<option value="${s.id}" ${s.id === recSessionFilter ? "selected" : ""}>${esc(c?.code || "")} · ${s.date}</option>`;
          })
          .join("")}
      </select>
      <select onchange="recStatusFilter=this.value;renderPage('records')" style="width:140px;">
        <option value="All">All Status</option>
        ${Object.entries(STATUS_META)
          .map(
            ([k, v]) =>
              `<option value="${k}" ${k === recStatusFilter ? "selected" : ""}>${v.labelEn}</option>`,
          )
          .join("")}
      </select>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead><tr>${["Student", "Session", "Time", "Method", "Status", "Note", "Actions"].map((h) => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
      }
      function editRecord(id) {
        const r = records.find((x) => x.id === id);
        if (!r) return;
        openModal(
          "Edit Record",
          `
    <div style="display:grid;gap:14px;">
      <div><div class="field-label">Status</div><select id="rf-status">${Object.entries(
        STATUS_META,
      )
        .map(
          ([k, v]) =>
            `<option value="${k}" ${k === r.status ? "selected" : ""}>${v.labelEn}</option>`,
        )
        .join("")}</select></div>
      <div><div class="field-label">Time</div><input type="time" id="rf-time" value="${r.time}" /></div>
      <div><div class="field-label">Method</div><select id="rf-method">${METHODS.map((m) => `<option ${m === r.method ? "selected" : ""}>${m}</option>`).join("")}</select></div>
      <div><div class="field-label">Note</div><input type="text" id="rf-note" value="${esc(r.note)}" /></div>
    </div>
    <div class="flex gap-10" style="justify-content:flex-end;margin-top:22px;">
      <button onclick="closeModal()" class="btn btn-ghost">Cancel</button>
      <button class="btn btn-yellow" onclick="saveRecord('${id}')">Save Changes</button>
    </div>
  `,
        );
      }
      function saveRecord(id) {
        const i = records.findIndex((r) => r.id === id);
        if (i < 0) return;
        records[i] = {
          ...records[i],
          status: document.getElementById("rf-status").value,
          time: document.getElementById("rf-time").value,
          method: document.getElementById("rf-method").value,
          note: document.getElementById("rf-note").value,
        };
        closeModal();
        updateSidebarInfo();
        renderPage("records");
        showToast("success", "Record updated");
      }
      function deleteRecord(id) {
        if (!confirm("Delete this record?")) return;
        records = records.filter((r) => r.id !== id);
        updateSidebarInfo();
        renderPage("records");
        showToast("warn", "Record deleted");
      }

      // ─── REPORTS ─────────────────────────────────────────────────────────────────
      let reportCourseId = "",
        reportFrom = "2025-01-01",
        reportTo = "2025-12-31";
      function renderReports() {
        if (!reportCourseId && courses.length) reportCourseId = courses[0].id;
        const course = courses.find((c) => c.id === reportCourseId);
        const filtSessions = sessions.filter(
          (s) =>
            s.courseId === reportCourseId &&
            s.date >= reportFrom &&
            s.date <= reportTo,
        );
        const filtRecs = records.filter((r) =>
          filtSessions.some((s) => s.id === r.sessionId),
        );
        const totalSessions = filtSessions.length;

        const studentReport = students
          .map((s) => {
            const sRecs = filtRecs.filter((r) => r.studentId === s.id);
            const pres = sRecs.filter((r) => r.status === "present").length;
            const late = sRecs.filter((r) => r.status === "late").length;
            const abs = sRecs.filter((r) => r.status === "absent").length;
            const exc = sRecs.filter((r) => r.status === "excused").length;
            const pct =
              totalSessions > 0
                ? Math.round(((pres + late) / totalSessions) * 100)
                : 0;
            return {
              ...s,
              present: pres,
              late,
              absent: abs,
              excused: exc,
              pct,
              total: sRecs.length,
            };
          })
          .filter((s) => s.total > 0 || totalSessions > 0);

        const oPresent = filtRecs.filter((r) => r.status === "present").length;
        const oLate = filtRecs.filter((r) => r.status === "late").length;
        const oAbsent = filtRecs.filter((r) => r.status === "absent").length;
        const oTotal = filtRecs.length;
        const oRate =
          oTotal > 0 ? Math.round(((oPresent + oLate) / oTotal) * 100) : 0;

        const stats = [
          {
            label: "Sessions",
            value: totalSessions,
            icon: "📅",
            color: "#5b8dee",
          },
          { label: "Present", value: oPresent, icon: "✅", color: "#3ecf8e" },
          { label: "Late", value: oLate, icon: "⏰", color: "#f5c842" },
          { label: "Absent", value: oAbsent, icon: "❌", color: "#f06a6a" },
          {
            label: "Overall Rate",
            value: `${oRate}%`,
            icon: "📊",
            color: oRate >= 75 ? "#3ecf8e" : "#f06a6a",
          },
        ]
          .map(
            (s) =>
              `<div class="stat"><div class="stat-glow" style="background:${s.color};"></div><div class="stat-label">${s.label}</div><div class="stat-value" style="color:${s.color};">${s.value}</div><div class="stat-icon">${s.icon}</div></div>`,
          )
          .join("");

        let barChart = "";
        if (filtSessions.length > 0) {
          const bars = filtSessions
            .map((sess) => {
              const sRecs = records.filter((r) => r.sessionId === sess.id);
              const sp = sRecs.filter((r) => r.status === "present").length;
              const sl = sRecs.filter((r) => r.status === "late").length;
              const sa = sRecs.filter((r) => r.status === "absent").length;
              const tot = sp + sl + sa || 1;
              return `<div class="bar-group">
        <div class="bar-stack">
          <div style="width:100%;height:${Math.round((sp / tot) * 90)}px;background:#3ecf8e;" title="Present: ${sp}"></div>
          <div style="width:100%;height:${Math.round((sl / tot) * 90)}px;background:#f5c842;" title="Late: ${sl}"></div>
          <div style="width:100%;height:${Math.round((sa / tot) * 90)}px;background:#f06a6a;" title="Absent: ${sa}"></div>
        </div>
        <div class="bar-date">${sess.date.slice(5)}</div>
      </div>`;
            })
            .join("");
          barChart = `<div class="card mb-16">
      <div style="font-weight:600;font-size:13px;margin-bottom:16px;">Session Breakdown</div>
      <div class="bar-chart">${bars}</div>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#3ecf8e;"></div>Present</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f5c842;"></div>Late</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f06a6a;"></div>Absent</div>
      </div>
    </div>`;
        }

        const tableRows = studentReport
          .map((s) => {
            const col = attendColor(s.pct);
            const statusLabel =
              s.pct >= 75
                ? "✅ Good"
                : s.pct >= 50
                  ? "⚠️ Warning"
                  : "❌ At Risk";
            const statusColor =
              s.pct >= 75 ? "#3ecf8e" : s.pct >= 50 ? "#f5c842" : "#f06a6a";
            return `<tr>
      <td><div class="flex gap-8" style="align-items:center;">${avatar(s.photo, undefined, 30)}
        <div><div style="font-size:12px;font-weight:600;">${esc(s.name)}</div>
        <div style="font-size:10px;color:var(--muted);font-family:var(--mono);">${s.id}</div></div></div></td>
      <td>${pill(s.program, programColor(s.program))}</td>
      <td style="font-size:13px;font-weight:600;color:#3ecf8e;">${s.present}</td>
      <td style="font-size:13px;font-weight:600;color:#f5c842;">${s.late}</td>
      <td style="font-size:13px;font-weight:600;color:#f06a6a;">${s.absent}</td>
      <td style="font-size:13px;font-weight:600;color:#9d7de8;">${s.excused}</td>
      <td>
        <div class="flex gap-8" style="align-items:center;">
          <div style="width:52px;height:4px;border-radius:3px;background:var(--border);overflow:hidden;">
            <div style="width:${s.pct}%;height:100%;background:${col};"></div>
          </div>
          <span style="font-size:12px;font-weight:600;color:${col};">${s.pct}%</span>
        </div>
      </td>
      <td><span style="font-size:11px;font-weight:600;color:${statusColor};">${statusLabel}</span></td>
    </tr>`;
          })
          .join("");

        return `
    <div class="page-header mb-24">
      <div><h1>Reports</h1><p class="subtitle">Attendance analytics by course</p></div>
    </div>
    <div class="card mb-20">
      <div class="flex gap-12" style="flex-wrap:wrap;align-items:flex-end;gap:12px;">
        <div style="flex:2;min-width:200px;">
          <div class="field-label">Course</div>
          <select onchange="reportCourseId=this.value;renderPage('reports')">
            ${courses.map((c) => `<option value="${c.id}" ${c.id === reportCourseId ? "selected" : ""}>${esc(c.code)} – ${esc(c.name)}</option>`).join("")}
          </select>
        </div>
        <div style="flex:1;">
          <div class="field-label">From</div>
          <input type="date" value="${reportFrom}" onchange="reportFrom=this.value;renderPage('reports')" />
        </div>
        <div style="flex:1;">
          <div class="field-label">To</div>
          <input type="date" value="${reportTo}" onchange="reportTo=this.value;renderPage('reports')" />
        </div>
      </div>
    </div>
    <div class="stats-grid mb-20">${stats}</div>
    ${barChart}
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead><tr>${["Student", "Program", "Present", "Late", "Absent", "Excused", `Rate (/${totalSessions})`, "Status"].map((h) => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${tableRows || `<tr><td colspan="8">${emptyState("📊", "No data for selected filters")}</td></tr>`}</tbody>
      </table>
    </div>
  `;
      }

      // ─── INIT ────────────────────────────────────────────────────────────────────
      buildNav();
