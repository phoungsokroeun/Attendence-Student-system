<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attendance Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #f0f2f8;
        --bg2: #3730a3;
        --surface: #ffffff;
        --card: #ffffff;
        --card2: #f8f9fd;
        --border: rgba(55, 48, 163, 0.12);
        --border2: rgba(55, 48, 163, 0.22);
        --text: #1e1b4b;
        --muted: #6b7280;
        --muted2: #4b5563;
        --accent: #4f46e5;
        --accentL: #818cf8;
        --green: #059669;
        --greenD: #047857;
        --yellow: #d97706;
        --red: #dc2626;
        --purple: #7c3aed;
        --pink: #db2777;
        --teal: #0891b2;
        --font: "DM Sans", sans-serif;
        --mono: "DM Mono", monospace;
        --r-sm: 8px;
        --r-md: 12px;
        --r-lg: 16px;
        --r-xl: 20px;
        --sidebar: 220px;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        font-size: 14px;
        line-height: 1.5;
      }

      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(55, 48, 163, 0.25);
        border-radius: 4px;
      }

      /* ── SIDEBAR ── */
      #sidebar {
        width: var(--sidebar);
        flex-shrink: 0;
        background: #3730a3;
        border-right: none;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }

      .logo {
        padding: 22px 18px 16px;
        display: flex;
        align-items: center;
        gap: 11px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        margin-bottom: 10px;
      }
      .logo-icon {
        width: 34px;
        height: 34px;
        border-radius: var(--r-sm);
        background: rgba(255, 255, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 17px;
      }
      .logo-name {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.2px;
        color: #fff;
      }
      .logo-sub {
        font-size: 10px;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 0.3px;
      }

      nav {
        padding: 4px 10px;
        flex: 1;
      }

      .nav-section {
        font-size: 9px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 1.2px;
        text-transform: uppercase;
        padding: 12px 8px 4px;
      }

      .nav-btn {
        width: 100%;
        padding: 9px 10px;
        border-radius: var(--r-md);
        margin-bottom: 1px;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.65);
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 500;
        font-size: 13px;
        cursor: pointer;
        text-align: left;
        transition: all 0.15s;
        font-family: var(--font);
        position: relative;
      }
      .nav-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .nav-btn.active {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        font-weight: 600;
      }
      .nav-btn.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 20%;
        bottom: 20%;
        width: 3px;
        background: #a5b4fc;
        border-radius: 0 3px 3px 0;
      }
      .nav-icon {
        font-size: 15px;
        width: 18px;
        text-align: center;
      }

      .sidebar-bottom {
        padding: 14px 14px 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }
      .sidebar-info {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.55);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sidebar-info::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #6ee7b7;
        flex-shrink: 0;
      }
      .reset-btn {
        width: 100%;
        padding: 8px;
        border-radius: var(--r-sm);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
        cursor: pointer;
        font-family: var(--font);
        transition: all 0.15s;
      }
      .reset-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
      }

      /* ── MAIN ── */
      #main {
        flex: 1;
        padding: 32px 36px;
        overflow-x: hidden;
        min-width: 0;
      }

      /* ── PAGE ── */
      .page {
        display: none;
        animation: fadeIn 0.2s ease;
      }
      .page.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ── TYPOGRAPHY ── */
      h1 {
        font-size: 22px;
        font-weight: 600;
        color: var(--text);
        margin: 0 0 3px;
        letter-spacing: -0.4px;
      }
      .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin: 0;
      }

      /* ── CARDS ── */
      .card {
        background: #fff;
        border-radius: var(--r-lg);
        border: 1px solid rgba(55, 48, 163, 0.1);
        padding: 20px 22px;
        box-shadow: 0 1px 3px rgba(55, 48, 163, 0.06);
      }
      .card-elevated {
        background: #f8f7ff;
        border-radius: var(--r-lg);
        border: 1px solid rgba(55, 48, 163, 0.14);
        padding: 20px 22px;
      }

      /* ── STAT ── */
      .stat {
        border-radius: var(--r-lg);
        padding: 18px 20px;
        flex: 1;
        min-width: 130px;
        position: relative;
        overflow: hidden;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .stat:hover {
        transform: translateY(-1px);
      }
      .stat-glow {
        display: none;
      }
      .stat-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
        opacity: 0.75;
      }
      .stat-value {
        font-size: 28px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -1px;
      }
      .stat-sub {
        font-size: 11px;
        margin-top: 5px;
        opacity: 0.65;
      }
      .stat-icon {
        font-size: 20px;
        position: absolute;
        top: 18px;
        right: 18px;
        opacity: 0.5;
      }
      .stat-trend {
        font-size: 10px;
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 3px;
      }

      /* ── BADGE ── */
      .badge {
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        letter-spacing: 0.1px;
      }
      .badge-present {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #6ee7b7;
      }
      .badge-late {
        background: #fef3c7;
        color: #92400e;
        border: 1px solid #fcd34d;
      }
      .badge-absent {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }
      .badge-excused {
        background: #ede9fe;
        color: #4c1d95;
        border: 1px solid #c4b5fd;
      }

      /* ── PILL ── */
      .pill {
        padding: 2px 9px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 600;
        display: inline-block;
        letter-spacing: 0.2px;
      }

      /* ── AVATAR ── */
      .avatar {
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        flex-shrink: 0;
        letter-spacing: -0.5px;
        font-family: var(--mono);
      }

      /* ── TABLE ── */
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead tr {
        background: rgba(255, 255, 255, 0.02);
      }
      th {
        padding: 11px 16px;
        text-align: left;
        font-size: 10px;
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 13px 16px;
      }
      tbody tr {
        border-bottom: 1px solid var(--border);
        transition: background 0.15s;
      }
      tbody tr:last-child {
        border-bottom: none;
      }
      tbody tr:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      /* ── INPUTS ── */
      .field-label {
        font-size: 11px;
        color: var(--muted2);
        font-weight: 600;
        margin-bottom: 6px;
        letter-spacing: 0.2px;
      }
      .field-label .req {
        color: var(--red);
      }
      input[type="text"],
      input[type="number"],
      input[type="date"],
      input[type="time"],
      input[type="email"],
      select,
      textarea {
        width: 100%;
        padding: 9px 13px;
        border-radius: var(--r-sm);
        background: var(--surface);
        border: 1px solid var(--border2);
        color: var(--text);
        font-size: 13px;
        outline: none;
        font-family: var(--font);
        transition: border-color 0.15s;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: rgba(91, 141, 238, 0.5);
      }
      input::placeholder {
        color: var(--muted);
      }
      select option {
        background: var(--surface);
      }

      /* ── BUTTONS ── */
      .btn {
        padding: 9px 20px;
        border-radius: var(--r-sm);
        border: none;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font);
        transition: all 0.15s;
        letter-spacing: -0.1px;
      }
      .btn-accent {
        background: var(--accent);
        color: #fff;
        box-shadow: 0 4px 12px rgba(91, 141, 238, 0.3);
      }
      .btn-accent:hover {
        background: var(--accentL);
        box-shadow: 0 6px 16px rgba(91, 141, 238, 0.4);
      }
      .btn-purple {
        background: var(--purple);
        color: #fff;
        box-shadow: 0 4px 12px rgba(157, 125, 232, 0.3);
      }
      .btn-green {
        background: var(--green);
        color: #0c1a12;
        box-shadow: 0 4px 12px rgba(62, 207, 142, 0.3);
      }
      .btn-yellow {
        background: var(--yellow);
        color: #1a1200;
      }
      .btn-ghost {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border2);
        color: var(--muted2);
      }
      .btn-ghost:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
      }
      .btn-red-ghost {
        background: rgba(240, 106, 106, 0.08);
        border: 1px solid rgba(240, 106, 106, 0.2);
        color: var(--red);
        padding: 9px 20px;
        border-radius: var(--r-sm);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        font-family: var(--font);
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-red-ghost:hover {
        background: rgba(240, 106, 106, 0.14);
      }

      .action-btn {
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
        font-family: var(--font);
        border: 1px solid transparent;
        transition: all 0.12s;
      }

      /* ── MODAL ── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(4px);
        z-index: 9999;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal-box {
        background: var(--card2);
        border-radius: var(--r-xl);
        border: 1px solid var(--border2);
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
        animation: slideUp 0.2s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .modal-title {
        font-weight: 600;
        font-size: 16px;
        letter-spacing: -0.3px;
      }
      .modal-close {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--border2);
        color: var(--muted2);
        font-size: 16px;
        cursor: pointer;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
      }
      .modal-close:hover {
        background: rgba(255, 255, 255, 0.1);
        color: var(--text);
      }
      .modal-body {
        padding: 22px 24px;
      }

      /* ── EMPTY STATE ── */
      .empty {
        text-align: center;
        padding: 48px 20px;
        color: var(--muted);
      }
      .empty-icon {
        font-size: 32px;
        margin-bottom: 12px;
        opacity: 0.5;
      }
      .empty-text {
        font-size: 13px;
      }

      /* ── GRID UTILS ── */
      .flex {
        display: flex;
      }
      .flex-wrap {
        flex-wrap: wrap;
      }
      .gap-8 {
        gap: 8px;
      }
      .gap-10 {
        gap: 10px;
      }
      .gap-12 {
        gap: 12px;
      }
      .gap-14 {
        gap: 14px;
      }
      .gap-16 {
        gap: 16px;
      }
      .gap-20 {
        gap: 20px;
      }
      .mb-12 {
        margin-bottom: 12px;
      }
      .mb-16 {
        margin-bottom: 16px;
      }
      .mb-20 {
        margin-bottom: 20px;
      }
      .mb-24 {
        margin-bottom: 24px;
      }
      .mb-28 {
        margin-bottom: 28px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .span-2 {
        grid-column: 1 / -1;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 26px;
      }

      .scan-input {
        flex: 1;
        padding: 10px 14px;
        border-radius: var(--r-sm);
        background: var(--surface);
        border: 1.5px solid rgba(91, 141, 238, 0.3);
        color: var(--text);
        font-size: 13px;
        outline: none;
        font-family: var(--font);
        transition: border-color 0.15s;
      }
      .scan-input:focus {
        border-color: rgba(91, 141, 238, 0.6);
      }

      .progress-bar {
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.5s ease;
      }

      .section-label {
        font-size: 10px;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 12px;
      }

      .course-card {
        background: var(--card);
        border-radius: var(--r-lg);
        border: 1px solid var(--border);
        padding: 20px 22px;
        transition: border-color 0.2s;
      }
      .course-card:hover {
        border-color: var(--border2);
      }

      .scan-result {
        margin-top: 12px;
        padding: 12px 14px;
        border-radius: var(--r-sm);
        font-size: 12px;
      }
      .scan-success {
        background: rgba(62, 207, 142, 0.08);
        border: 1px solid rgba(62, 207, 142, 0.2);
        color: var(--green);
      }
      .scan-warn {
        background: rgba(245, 200, 66, 0.08);
        border: 1px solid rgba(245, 200, 66, 0.2);
        color: var(--yellow);
      }
      .scan-error {
        background: rgba(240, 106, 106, 0.08);
        border: 1px solid rgba(240, 106, 106, 0.2);
        color: var(--red);
      }

      .roster-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-radius: var(--r-md);
        border: 1px solid var(--border);
        transition: all 0.15s;
        margin-bottom: 5px;
      }

      .method-tab {
        flex: 1;
        padding: 7px 4px;
        border-radius: var(--r-sm);
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        border: 1px solid var(--border2);
        background: transparent;
        color: var(--muted);
        font-family: var(--font);
      }
      .method-tab.active {
        border-color: var(--accent);
        background: rgba(91, 141, 238, 0.1);
        color: var(--accentL);
      }

      .bar-chart {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        height: 110px;
        overflow-x: auto;
      }
      .bar-group {
        flex: 1;
        min-width: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100%;
      }
      .bar-stack {
        flex: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        border-radius: 4px 4px 0 0;
        overflow: hidden;
      }
      .bar-date {
        font-size: 9px;
        color: var(--muted);
        margin-top: 5px;
        text-align: center;
        font-family: var(--mono);
      }

      .chart-legend {
        display: flex;
        gap: 18px;
        margin-top: 12px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--muted2);
      }
      .legend-dot {
        width: 8px;
        height: 8px;
        border-radius: 3px;
      }

      /* stat cards grid fix */
      .stats-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 22px;
      }
      .stats-grid .stat {
        min-width: 130px;
      }

      /* Divider */
      .divider {
        height: 1px;
        background: var(--border);
        margin: 16px 0;
      }

      /* Tag */
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 10px;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted2);
        border: 1px solid var(--border2);
      }

      /* toast */
      #toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .toast-item {
        padding: 12px 18px;
        border-radius: var(--r-md);
        font-size: 13px;
        font-weight: 500;
        border: 1px solid;
        animation: toastIn 0.25s ease;
        max-width: 320px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .toast-success {
        background: rgba(62, 207, 142, 0.12);
        border-color: rgba(62, 207, 142, 0.25);
        color: var(--green);
      }
      .toast-warn {
        background: rgba(245, 200, 66, 0.12);
        border-color: rgba(245, 200, 66, 0.25);
        color: var(--yellow);
      }
      .toast-error {
        background: rgba(240, 106, 106, 0.12);
        border-color: rgba(240, 106, 106, 0.25);
        color: var(--red);
      }

      /* Search input wrapper */
      .search-wrap {
        position: relative;
      }
      .search-wrap input {
        padding-left: 36px;
      }
      .search-wrap::before {
        content: "🔍";
        position: absolute;
        left: 11px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 13px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- ── SIDEBAR ── -->
    <div id="sidebar">
      <div class="logo">
        <div class="logo-icon">🎓</div>
        <div>
          <div class="logo-name">Attendance System</div>
        </div>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom">
        <div class="sidebar-info" id="sidebar-info"></div>

          day: "2-digit",
          month: "short",
          year: "numeric",
        });
      const esc = (s) =>
        String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");

        const bg = color + "1e";
        const border = color + "40";
        const fs = Math.round(size * 0.32);
        return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${fs}px;color:${color};background:${bg};border:1.5px solid ${border};">${esc(initials)}</div>`;
      }

        const m = STATUS_META[status] || STATUS_META.absent;
        return `<span class="badge badge-${status}">${m.icon} ${m.labelEn}</span>`;
      }

      function pill(text, color = "#5b8dee") {
        return `<span class="pill" style="background:${color}1a;color:${color};border:1px solid ${color}28;">${esc(text)}</span>`;
      }

      function progBar(pct, color) {
        return `<div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color};"></div></div>`;
      }

      function attendColor(pct) {
        return pct >= 80 ? "#3ecf8e" : pct >= 60 ? "#f5c842" : "#f06a6a";
      }

      function getStudentStats(sid) {
        const recs = records.filter((r) => r.studentId === sid);
        const present = recs.filter(
          (r) => r.status === "present" || r.status === "late",
        ).length;
        return {
          total: recs.length,
          present,
          pct: recs.length ? Math.round((present / recs.length) * 100) : 100,
        };
      }

      function actionBtn(label, color, onclick) {
        return `<button class="action-btn" style="background:${color}12;border-color:${color}28;color:${color};" onclick="${onclick}">${label}</button>`;

        return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-text">${esc(text)}</div></div>`;

        const t = document.getElementById("toast");
        const el = document.createElement("div");
        el.className = `toast-item toast-${type}`;
        el.textContent = msg;
        t.appendChild(el);
        setTimeout(() => el.remove(), 3500);

      function programColor(p) {
        return PROGRAM_COLORS[p] || "#5b8dee";

          if (n.group !== lastGroup) {
            html += `<div class="nav-section">${n.group}</div>`;
            lastGroup = n.group;
          }
          html += `<button class="nav-btn ${currentPage === n.id ? "active" : ""}" onclick="navigate('${n.id}')">
      <span class="nav-icon">${n.icon}</span>${n.label}
    </button>`;
        });
        nav.innerHTML = html;
      }

      function navigate(page) {
        currentPage = page;
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById("page-" + page).classList.add("active");
        buildNav();
        renderPage(page);
        updateSidebarInfo();
      }

          `${students.length} students · ${records.length} records`;
      }

        const el = document.getElementById("page-" + page);
        switch (page) {
          case "dashboard":
            el.innerHTML = renderDashboard();
            break;
          case "scanner":
            el.innerHTML = renderScanner();
            bindScanner();
            break;
          case "students":
            el.innerHTML = renderStudents();
            break;
          case "courses":
            el.innerHTML = renderCourses();
            break;
          case "sessions":
            el.innerHTML = renderSessions();
            break;
          case "records":
            el.innerHTML = renderRecords();
            break;
          case "reports":
            el.innerHTML = renderReports();
            break;
        }
      }

        if (!confirm("Reset all data to demo defaults?")) return;

      // ─── DASHBOARD ───────────────────────────────────────────────────────────────
      function renderDashboard() {
        const todaySessions = sessions.filter((s) => s.date === todayDate());
        const todayRecords = records.filter((r) =>
          todaySessions.some((s) => s.id === r.sessionId),
        );
        const present = todayRecords.filter(
          (r) => r.status === "present",
        ).length;
        const late = todayRecords.filter((r) => r.status === "late").length;
        const absent = todayRecords.filter((r) => r.status === "absent").length;
        const rate =
          todayRecords.length > 0
            ? Math.round((present / todayRecords.length) * 100)
            : 0;

        const allPcts = students.map((s) => getStudentStats(s.id).pct);
        const avgAtt = allPcts.length
          ? Math.round(allPcts.reduce((a, b) => a + b, 0) / allPcts.length)
          : 0;

        const studentStats = students
          .map((s) => {
            const st = getStudentStats(s.id);
            return { ...s, ...st };
          })
          .sort((a, b) => a.pct - b.pct);
        const atRisk = studentStats.filter((s) => s.pct < 75 && s.total > 0);

        const statBoxes = [
          {
            label: "Total Students",
            value: students.length,
            icon: "👥",
            color: "#5b8dee",
            sub: `${courses.length} courses`,
          },

            label: "Today Sessions",
            value: todaySessions.length,
            icon: "📅",
            color: "#9d7de8",
            sub: "Active today",
          },
          {
            label: "Present Today",
            value: present,
            icon: "✅",
            color: "#3ecf8e",
            sub: "On time",
          },
          {
            label: "Late Today",
            value: late,
            icon: "⏰",
            color: "#f5c842",
            sub: "After grace",
          },
          {
            label: "Absent Today",
            value: absent,
            icon: "❌",
            color: "#f06a6a",
            sub: "Unexcused",
          },
          {
            label: "Avg Attendance",
            value: `${avgAtt}%`,
            icon: "📊",
            color: avgAtt > 75 ? "#3ecf8e" : "#f06a6a",
            sub: "All students",
          },
        ]
          .map(
            (s) => `
    <div class="stat">
      <div class="stat-glow" style="background:${s.color};"></div>
      <div class="stat-label">${s.label}</div>

      <div class="stat-sub">${s.sub}</div>
      <div class="stat-icon">${s.icon}</div>
    </div>
  `,
          )
          .join("");

        const atRiskHTML =
          atRisk.length === 0
            ? emptyState("✅", "All students above threshold")

                .map(

      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
        <div class="flex gap-10" style="align-items:center;">
          ${avatar(s.photo, "#f06a6a", 34)}
          <div>
            <div style="font-size:12px;font-weight:600;">${esc(s.name)}</div>
            <div style="font-size:10px;color:var(--muted);">${s.id} · ${pill(s.program, programColor(s.program))}</div>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:16px;font-weight:600;color:#f06a6a;letter-spacing:-0.5px;">${s.pct}%</div>
          <div style="font-size:10px;color:var(--muted);">${s.present}/${s.total} sessions</div>
        </div>
      </div>
    `,
                )
                .join("");

        const recentHTML =
          records.length === 0
            ? emptyState("📋", "No records yet")
            : [...records]
                .reverse()
                .slice(0, 6)
                .map((r) => {
                  const s = students.find((x) => x.id === r.studentId);
                  const sess = sessions.find((x) => x.id === r.sessionId);
                  const c = courses.find((x) => x.id === sess?.courseId);

        <div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);">

            ${avatar(s?.photo || "??", undefined, 30)}

            </div>
          </div>
          ${badge(r.status)}
        </div>
      `;

                .join("");

        const courseOverview = courses
          .map((c) => {
            const cSess = sessions.filter((s) => s.courseId === c.id);
            const cRecs = records.filter((r) =>
              cSess.some((s) => s.id === r.sessionId),
            );
            const pres = cRecs.filter(
              (r) => r.status === "present" || r.status === "late",
            ).length;
            const pct =
              cRecs.length > 0 ? Math.round((pres / cRecs.length) * 100) : 0;
            const col = attendColor(pct);
            return `
      <div style="margin-bottom:16px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:10px;font-weight:700;color:var(--muted);font-family:var(--mono);">${esc(c.code)}</span>
            <span style="font-size:12px;font-weight:500;">${esc(c.name)}</span>
          </div>
          <span style="font-size:13px;font-weight:600;color:${col};">${pct}%</span>
        </div>
        ${progBar(pct, col)}
        <div style="font-size:10px;color:var(--muted);margin-top:4px;">${cSess.length} sessions · ${cRecs.length} records · ${esc(c.instructor)}</div>
      </div>
    `;
          })
          .join("");

        return `
    <div class="page-header mb-28">
      <div>
        <h1>Dashboard</h1>
        <p class="subtitle">Attendance overview · ${fmt(todayDate())}</p>
      </div>

          ⚠️ At-Risk Students ${pill(atRisk.length, "#f06a6a")}
        </div>
        ${atRiskHTML}
      </div>
      <div class="card">
        <div style="font-weight:600;font-size:13px;margin-bottom:16px;">🕐 Recent Check-Ins</div>
        ${recentHTML}
      </div>
    </div>
    <div class="card">
      <div style="font-weight:600;font-size:13px;margin-bottom:18px;">📚 Course Overview</div>
      ${courseOverview}
    </div>
  `;
      }

      // ─── SCANNER ─────────────────────────────────────────────────────────────────
      function renderScanner() {
        const sessionOptions = sessions
          .map((s) => {
            const c = courses.find((x) => x.id === s.courseId);
            return `<option value="${s.id}" ${s.id === scannerSession ? "selected" : ""}>${c?.code || ""} · ${s.date} · ${s.startTime}</option>`;
          })
          .join("");

        const sess = sessions.find((s) => s.id === scannerSession);
        const course = sess
          ? courses.find((c) => c.id === sess.courseId)
          : null;
        const sessInfo = sess
          ? `
    <div style="margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:rgba(91,141,238,0.06);border:1px solid rgba(91,141,238,0.15);font-size:12px;">
      <div style="font-weight:600;color:var(--accentL);">${esc(course?.name || "")}</div>
      <div style="color:var(--muted);margin-top:3px;">${sess.room} · ${sess.startTime}–${sess.endTime}</div>
      <div style="color:var(--muted);">${esc(course?.instructor || "")}</div>
    </div>
  `
          : "";

        const sessionRecs = records.filter(
          (r) => r.sessionId === scannerSession,
        );
        const sessionStudents = students.filter((s) => {
          if (!course) return true;
          return s.program === course.program;
        });
        const checkedCount = sessionRecs.filter(
          (r) => r.status !== "absent",
        ).length;
        const notCheckedCount = sessionStudents.length - sessionRecs.length;

        const methodTabs = METHODS.map(
          (m) =>
            `<button class="method-tab ${m === scanMethod ? "active" : ""}" onclick="setScanMethod('${esc(m)}')">${esc(m)}</button>`,
        ).join("");

        const rosterHTML = !scannerSession
          ? emptyState("📅", "Select a session to view roster")
          : sessionStudents
              .map((s) => {
                const rec = sessionRecs.find((r) => r.studentId === s.id);
                const col = rec
                  ? STATUS_META[rec.status].color
                  : "var(--muted)";
                const bg = rec
                  ? STATUS_META[rec.status].color + "0d"
                  : "transparent";
                const bord = rec
                  ? STATUS_META[rec.status].color + "28"
                  : "var(--border)";
                const rightHTML = rec
                  ? `<div class="flex gap-8" style="align-items:center;">
             <div style="font-size:10px;color:var(--muted);text-align:right;font-family:var(--mono);"><div>${rec.time}</div><div style="font-family:var(--font);">${rec.method}</div></div>
             ${badge(rec.status)}
           </div>`
                  : `<button onclick="scannerCheckIn('${s.id}')" style="padding:6px 14px;border-radius:var(--r-sm);background:rgba(91,141,238,0.1);border:1px solid rgba(91,141,238,0.2);color:#7aaaf5;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);">Check In</button>`;
                return `
        <div class="roster-row" style="background:${bg};border-color:${bord};">
          <div class="flex gap-10" style="align-items:center;">
            ${avatar(s.photo, col, 34)}
            <div>
              <div style="font-size:12px;font-weight:600;">${esc(s.name)}</div>
              <div style="font-size:10px;color:var(--muted);">${s.id} · ${esc(s.nameEn)}</div>
            </div>
          </div>
          ${rightHTML}
        </div>
      `;
              })
              .join("");

        const studentOptions = students
          .map(
            (s) => `<option value="${s.id}">${s.id} – ${esc(s.name)}</option>`,
          )
          .join("");

        return `
    <div class="page-header mb-24">
      <div>
        <h1>Live Check-In</h1>
        <p class="subtitle">ស្កេនអត្តសញ្ញាណប័ណ្ណ ឬបញ្ចូលដៃ</p>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:320px 1fr;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="card">
          <div class="section-label">Session</div>
          <select onchange="setScannerSession(this.value)" style="width:100%;">
            <option value="">— Choose session —</option>
            ${sessionOptions}
          </select>
          ${sessInfo}
        </div>
        <div class="card">
          <div class="section-label">Scan Method</div>
          <div class="flex gap-6 mb-16" style="gap:6px;">${methodTabs}</div>
          <div class="flex gap-8">
            <input class="scan-input" id="scan-input" placeholder="Student ID or name…"
              onkeydown="if(event.key==='Enter')doScan()" autocomplete="off" />
            <button class="btn btn-accent" onclick="doScan()" style="padding:10px 14px;font-size:14px;">✓</button>
          </div>
          <div id="scan-result"></div>
        </div>
        <div class="card">
          <div class="section-label">Manual Entry</div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div>
              <div class="field-label">Student</div>
              <select id="manual-student">
                <option value="">— Select —</option>
                ${studentOptions}
              </select>
            </div>
            <div>
              <div class="field-label">Status</div>
              <select id="manual-status">
                ${Object.entries(STATUS_META)
                  .map(([k, v]) => `<option value="${k}">${v.labelEn}</option>`)
                  .join("")}
              </select>
            </div>
            <div>
              <div class="field-label">Note (optional)</div>
              <input type="text" id="manual-note" placeholder="Add a note…" />
            </div>
          </div>
          <button onclick="doManualEntry()" class="btn btn-purple" style="width:100%;margin-top:14px;justify-content:center;">Add Record</button>
        </div>
        <button class="btn-red-ghost" onclick="markAllAbsent()" style="width:100%;justify-content:center;">
          ⚠️ Mark All Remaining Absent (${notCheckedCount})
        </button>
      </div>
      <div class="card" style="padding:18px 20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
          <div style="font-weight:600;font-size:13px;">Session Roster</div>
          <div class="flex gap-8">
            ${pill(checkedCount + " checked", "#3ecf8e")}
            ${pill(notCheckedCount + " remaining", "#f06a6a")}
          </div>
        </div>
        <div id="roster-list">${rosterHTML}</div>
      </div>
    </div>
  `;
      }

      function bindScanner() {
        setTimeout(() => {
          const i = document.getElementById("scan-input");
          if (i) i.focus();
        }, 100);
      }
      function setScanMethod(m) {
        scanMethod = m;
        document.querySelectorAll(".method-tab").forEach((b) => {
          b.classList.toggle("active", b.textContent.trim() === m);
        });
      }
      function setScannerSession(id) {
        scannerSession = id;
        renderPage("scanner");
        bindScanner();
      }
      function doScan() {
        const inp = document.getElementById("scan-input");
        const val = inp.value.trim();
        if (!val) return;
        performCheckIn(val, null, "");
        inp.value = "";
        inp.focus();
      }
      function scannerCheckIn(studentId) {
        performCheckIn(studentId, null, "");
      }
      function doManualEntry() {
        const sid = document.getElementById("manual-student").value;
        const status = document.getElementById("manual-status").value;
        const note = document.getElementById("manual-note").value;
        if (!sid) return;
        performCheckIn(sid, status, note);
        document.getElementById("manual-student").value = "";
        document.getElementById("manual-note").value = "";
      }
      function markAllAbsent() {
        if (!scannerSession) return;
        const sess = sessions.find((s) => s.id === scannerSession);
        const course = sess
          ? courses.find((c) => c.id === sess.courseId)
          : null;
        const sessionStudents = students.filter(
          (s) => !course || s.program === course.program,
        );
        const sessionRecs = records.filter(
          (r) => r.sessionId === scannerSession,
        );
        const now = nowTime();
        let count = 0;
        sessionStudents.forEach((s) => {
          if (!sessionRecs.some((r) => r.studentId === s.id)) {
            records.push({
              id: "R" + uid(),
              sessionId: scannerSession,
              studentId: s.id,
              time: now,
              status: "absent",
              method: "System",
              note: "Auto-marked absent",
            });
            count++;
          }
        });
        updateSidebarInfo();
        renderPage("scanner");
        if (count > 0) showToast("warn", `${count} students marked absent`);
      }
      function performCheckIn(input, overrideStatus, note) {
        if (!scannerSession) {
          showScanResult("error", "Please select a session first");
          return;
        }
        const student = students.find(
          (s) =>
            s.id === input ||
            s.nameEn.toLowerCase().includes(input.toLowerCase()),
        );
        if (!student) {
          showScanResult("error", `Student not found: "${input}"`);
          return;
        }
        const existing = records.find(
          (r) => r.sessionId === scannerSession && r.studentId === student.id,
        );
        if (existing) {
          showScanResult(
            "warn",
            `${student.nameEn} already checked in (${existing.status})`,
          );
          return;
        }
        const sess = sessions.find((s) => s.id === scannerSession);
        const now = nowTime();
        let status = overrideStatus;
        if (!status && sess) {
          const [sh, sm] = sess.startTime.split(":").map(Number);
          const [nh, nm] = now.split(":").map(Number);
          const diff = nh * 60 + nm - (sh * 60 + sm);
          status = diff <= sess.lateAfter ? "present" : "late";
        }
        status = status || "present";
        const rec = {
          id: "R" + uid(),
          sessionId: scannerSession,
          studentId: student.id,
          time: now,
          status,
          method: scanMethod,
          note,
        };
        records.push(rec);
        recentScans.unshift({ ...rec, studentName: student.name });
        if (recentScans.length > 10) recentScans.length = 10;
        updateSidebarInfo();

        // Update roster in-place
        const rosterEl = document.getElementById("roster-list");
        if (rosterEl) {
          const sess2 = sessions.find((s) => s.id === scannerSession);
          const course = sess2
            ? courses.find((c) => c.id === sess2.courseId)
            : null;
          const sessionStudents = students.filter(
            (s) => !course || s.program === course.program,
          );
          const sessionRecs = records.filter(
            (r) => r.sessionId === scannerSession,
          );
          const checkedCount = sessionRecs.filter(
            (r) => r.status !== "absent",
          ).length;
          const notCheckedCount = sessionStudents.length - sessionRecs.length;
          const pillsEl = document.querySelector("#page-scanner .flex.gap-8");
          if (pillsEl)
            pillsEl.innerHTML =
              pill(checkedCount + " checked", "#3ecf8e") +
              pill(notCheckedCount + " remaining", "#f06a6a");
          rosterEl.innerHTML = sessionStudents
            .map((s) => {
              const rec = sessionRecs.find((r) => r.studentId === s.id);
              const col = rec ? STATUS_META[rec.status].color : "var(--muted)";
              const bg = rec
                ? STATUS_META[rec.status].color + "0d"
                : "transparent";
              const bord = rec
                ? STATUS_META[rec.status].color + "28"
                : "var(--border)";
              const rightHTML = rec
                ? `<div class="flex gap-8" style="align-items:center;"><div style="font-size:10px;color:var(--muted);text-align:right;font-family:var(--mono);"><div>${rec.time}</div><div style="font-family:var(--font);">${rec.method}</div></div>${badge(rec.status)}</div>`
                : `<button onclick="scannerCheckIn('${s.id}')" style="padding:6px 14px;border-radius:var(--r-sm);background:rgba(91,141,238,0.1);border:1px solid rgba(91,141,238,0.2);color:#7aaaf5;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);">Check In</button>`;
              return `<div class="roster-row" style="background:${bg};border-color:${bord};">
        <div class="flex gap-10" style="align-items:center;">${avatar(s.photo, col, 34)}<div><div style="font-size:12px;font-weight:600;">${esc(s.name)}</div><div style="font-size:10px;color:var(--muted);">${s.id} · ${esc(s.nameEn)}</div></div></div>
        ${rightHTML}</div>`;
            })
            .join("");
        }
        showScanResult(
          "success",
          `✅ ${student.nameEn} checked in — ${STATUS_META[status].labelEn}`,
        );
        showToast("success", `${student.nameEn} checked in as ${status}`);
        setTimeout(() => {
          const el = document.getElementById("scan-result");
          if (el) el.innerHTML = "";
        }, 3000);
      }
      function showScanResult(type, html) {
        const el = document.getElementById("scan-result");
        if (!el) return;
        const cls = {
          success: "scan-success",
          warn: "scan-warn",
          error: "scan-error",
        }[type];
        el.innerHTML = `<div class="scan-result ${cls}">${html}</div>`;
      }

      // ─── STUDENTS ────────────────────────────────────────────────────────────────
      let studentSearch = "",
        studentFilter = "All";
      function renderStudents() {
        const filtered = students.filter((s) => {
          const ok =
            !studentSearch ||
            s.name.includes(studentSearch) ||
            s.nameEn.toLowerCase().includes(studentSearch.toLowerCase()) ||
            s.id.includes(studentSearch);
          return ok && (studentFilter === "All" || s.program === studentFilter);
        });
        const rows =
          filtered.length === 0
            ? `<tr><td colspan="6">${emptyState("👥", "No students found")}</td></tr>`
            : filtered
                .map((s) => {
                  const st = getStudentStats(s.id);
                  const col = attendColor(st.pct);
                  return `
          <tr>
            <td>
              <div class="flex gap-10" style="align-items:center;">
                ${avatar(s.photo, programColor(s.program), 36)}
                <div>
                  <div style="font-size:13px;font-weight:600;">${esc(s.name)}</div>
                  <div style="font-size:10px;color:var(--muted);font-family:var(--mono);">${s.id} · ${esc(s.nameEn)}</div>
                </div>
              </div>
            </td>
            <td>${pill(s.program, programColor(s.program))}</td>
            <td style="font-size:12px;color:var(--muted2);">Year ${s.year}</td>
            <td style="font-size:12px;color:var(--muted);font-family:var(--mono);">${esc(s.phone)}</td>
            <td>
              <div class="flex gap-8" style="align-items:center;">
                ${progBar(st.pct, col).replace('class="progress-bar"', 'class="progress-bar" style="width:64px;"')}
                <span style="font-size:12px;font-weight:600;color:${col};">${st.pct}%</span>
              </div>
              <div style="font-size:10px;color:var(--muted);margin-top:3px;">${st.present}/${st.total} sessions</div>
            </td>
            <td>
              <div class="flex gap-6" style="gap:6px;">
                ${actionBtn("View", "#5b8dee", `viewStudent('${s.id}')`)}
                ${actionBtn("Edit", "#9d7de8", `editStudent('${s.id}')`)}
                ${actionBtn("Del", "#f06a6a", `deleteStudent('${s.id}')`)}
              </div>
            </td>
          </tr>
        `;
                })
                .join("");
        return `
    <div class="page-header mb-24">
      <div>
        <h1>Students</h1>
        <p class="subtitle">${students.length} total students</p>
      </div>
      <button class="btn btn-accent" onclick="addStudent()">+ Add Student</button>
    </div>
    <div class="flex gap-10 mb-16">
      <div class="search-wrap" style="flex:1;">
        <input type="text" value="${esc(studentSearch)}" placeholder="Search by name, ID…"
          oninput="studentSearch=this.value;renderPage('students')" />
      </div>
      <select onchange="studentFilter=this.value;renderPage('students')" style="width:130px;">
        ${["All", "IT", "CS", "BA", "ENG", "MED"].map((p) => `<option ${p === studentFilter ? "selected" : ""}>${p}</option>`).join("")}
      </select>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead><tr>${["Student", "Program", "Year", "Phone", "Attendance", "Actions"].map((h) => `<th>${h}</th>`).join("")}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
      }

      function addStudent() {
        const id = "S" + uid().slice(0, 3);
        openModal(
          "Add Student",
          studentForm(
            {
              id,
              name: "",
              nameEn: "",
              gender: "M",
              phone: "",
              program: "IT",
              year: 1,
              photo: "",
            },
            "add",
          ),
        );
      }
      function editStudent(id) {
        const s = students.find((x) => x.id === id);
        if (!s) return;
        openModal("Edit Student", studentForm(s, "edit"));
      }
      function studentForm(s, mode) {
        return `
    <div class="grid-2">
      <div class="span-2">
        <div class="field-label">Student ID <span class="req">*</span></div>
        <input type="text" id="sf-id" value="${esc(s.id)}" />
      </div>
      <div>
        <div class="field-label">Khmer Name <span class="req">*</span></div>
        <input type="text" id="sf-name" value="${esc(s.name)}" />
      </div>
      <div>
        <div class="field-label">English Name <span class="req">*</span></div>
        <input type="text" id="sf-nameEn" value="${esc(s.nameEn)}" />
      </div>
      <div>
        <div class="field-label">Gender</div>
        <select id="sf-gender">
          <option value="M" ${s.gender === "M" ? "selected" : ""}>Male</option>
          <option value="F" ${s.gender === "F" ? "selected" : ""}>Female</option>
        </select>
      </div>
      <div>
        <div class="field-label">Phone</div>
        <input type="text" id="sf-phone" value="${esc(s.phone)}" />
      </div>
      <div>
        <div class="field-label">Program</div>
        <select id="sf-program">
          ${["IT", "CS", "BA", "ENG", "MED"].map((p) => `<option ${p === s.program ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>
      <div>
        <div class="field-label">Year</div>
        <input type="number" id="sf-year" value="${s.year}" min="1" max="6" />
      </div>
    </div>
    <div class="flex gap-10" style="justify-content:flex-end;margin-top:22px;">
      <button onclick="closeModal()" class="btn btn-ghost">Cancel</button>
      <button class="btn btn-accent" onclick="saveStudent('${esc(s.id)}','${mode}')">${mode === "add" ? "Add Student" : "Save Changes"}</button>
    </div>
  `;
      }
      function saveStudent(oldId, mode) {
        const name = document.getElementById("sf-name").value.trim();
        const nameEn = document.getElementById("sf-nameEn").value.trim();
        if (!name || !nameEn) {
          showToast("error", "Name fields are required");
          return;
        }
        const id = document.getElementById("sf-id").value.trim();
        const photo = nameEn
          .split(" ")
          .map((w) => w[0])
          .join("")
          .slice(0, 2)
          .toUpperCase();
        const obj = {
          id,
          name,
          nameEn,
          photo,
          gender: document.getElementById("sf-gender").value,
          phone: document.getElementById("sf-phone").value.trim(),
          program: document.getElementById("sf-program").value,
          year: parseInt(document.getElementById("sf-year").value) || 1,
        };
        if (mode === "add") {
          students.push(obj);
          showToast("success", "Student added");
        } else {
          const i = students.findIndex((s) => s.id === oldId);
          if (i >= 0) students[i] = obj;
          showToast("success", "Student updated");
        }
        closeModal();
        updateSidebarInfo();
        renderPage("students");
      }
      function deleteStudent(id) {
        if (!confirm("Delete this student?")) return;
        students = students.filter((s) => s.id !== id);
        updateSidebarInfo();
        renderPage("students");
        showToast("warn", "Student deleted");
      }
      function viewStudent(id) {
        const s = students.find((x) => x.id === id);
        if (!s) return;
        const st = getStudentStats(id);
        const col = attendColor(st.pct);
        const viewRecs = records.filter((r) => r.studentId === id);
        const recsHTML =
          viewRecs.length === 0
            ? emptyState("📋", "No attendance records")
            : viewRecs
                .map((r) => {
                  const sess = sessions.find((x) => x.id === r.sessionId);
                  const c = courses.find((x) => x.id === sess?.courseId);
                  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:var(--r-sm);background:var(--surface);margin-bottom:4px;">
        <div>
          <div style="font-size:12px;font-weight:500;">${esc(c?.code || "")} – ${esc(c?.name || "")}</div>
          <div style="font-size:10px;color:var(--muted);font-family:var(--mono);">${sess?.date || ""} · ${r.time} · <span style="font-family:var(--font);">${r.method}</span></div>
        </div>
        ${badge(r.status)}
      </div>`;
                })
                .join("");
        openModal(
          "Student Profile",
          `
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px 18px;background:var(--surface);border-radius:var(--r-lg);">
      ${avatar(s.photo, programColor(s.program), 54)}
      <div>
        <div style="font-size:19px;font-weight:600;letter-spacing:-0.4px;">${esc(s.name)}</div>
        <div style="font-size:13px;color:var(--muted);margin-top:2px;">${esc(s.nameEn)} · <span style="font-family:var(--mono);">${s.id}</span></div>
        <div class="flex gap-6" style="margin-top:8px;gap:6px;">
          ${pill(s.program, programColor(s.program))} ${pill("Year " + s.year)} ${pill(st.pct + "% attendance", col)}
        </div>
      </div>
    </div>
    <div class="section-label">Attendance History</div>
    <div style="max-height:280px;overflow-y:auto;">${recsHTML}</div>
  `,
        );
      }

      // ─── COURSES ─────────────────────────────────────────────────────────────────
      function renderCourses() {
        const cards = courses
          .map((c) => {
            const cSess = sessions.filter((s) => s.courseId === c.id);
            const cRecs = records.filter((r) =>
              cSess.some((s) => s.id === r.sessionId),
            );
            const pres = cRecs.filter(
              (r) => r.status === "present" || r.status === "late",
            ).length;
            const pct = cRecs.length
              ? Math.round((pres / cRecs.length) * 100)
              : 0;
            const col = attendColor(pct);
            const pc = programColor(c.program);
            return `
      <div class="course-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
          <div>
            <div style="font-size:10px;font-weight:700;color:${pc};letter-spacing:1.2px;font-family:var(--mono);margin-bottom:4px;">${esc(c.code)}</div>
            <div style="font-size:15px;font-weight:600;letter-spacing:-0.3px;margin-bottom:2px;">${esc(c.name)}</div>
            <div style="font-size:11px;color:var(--muted);">${esc(c.nameKh)}</div>
          </div>
          ${pill(c.program, pc)}
        </div>
        <div style="font-size:11px;color:var(--muted2);margin-bottom:14px;display:flex;align-items:center;gap:4px;">

        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;margin-bottom:14px;">
          <span style="font-size:10px;color:var(--muted);">${cRecs.length} total records</span>

    `;
          })

        return `

    </div>

  `;
      }
      function courseForm(c, mode) {
        return `
    <div class="grid-2">
      <div><div class="field-label">Course Code <span class="req">*</span></div><input type="text" id="cf-code" value="${esc(c.code)}" /></div>

      function addCourse() {
        openModal(
          "Add Course",
          courseForm(
            {
              id: "C" + uid().slice(0, 3),
              code: "",
              name: "",
              nameKh: "",
              credits: 3,
              program: "IT",
              instructor: "",
            },
            "add",
          ),
        );
      }
      function editCourse(id) {
        const c = courses.find((x) => x.id === id);
        if (c) openModal("Edit Course", courseForm(c, "edit"));
      }
      function saveCourse(oldId, mode) {
        const code = document.getElementById("cf-code").value.trim();
        const name = document.getElementById("cf-name").value.trim();
        if (!code || !name) return;
        const obj = {
          id: oldId,
          code,
          name,
          nameKh: document.getElementById("cf-nameKh").value.trim(),
          instructor: document.getElementById("cf-instructor").value.trim(),
          program: document.getElementById("cf-program").value,

        };
        if (mode === "add") {
          obj.id = "C" + uid().slice(0, 3);
